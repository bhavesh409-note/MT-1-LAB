<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill Table</title>

    <style>
    body {
      font-family: Arial, sans-serif;
    }

    table {
      width: 500px;
      margin: 20px auto;
      border: 2px solid #333;
      border-collapse: collapse;
      text-align: center;
    }

    caption {
      padding: 8px;
      color: blue;
      font-size: 20px;
      font-weight: bold;
    }

    th,
    td {
      border: 1px solid #333;
      padding: 6px;
    }

    thead,
    tfoot {
      background-color: #cce5f5;
    }
  </style>
</head>
<body>
    <h1><b> Shopping Bill Table(5 Marks) </b></h1>
    <h3>create an HTML page to display a shopping bill using thead ,image,and ffoot. Show total amount </h3>
    </h2><b>Desired Output:</b></h2>

     <h1><b>Shopping Bill</b></h1>
     
     <table border="1">
     <thead>
     <tr>
        <th>Item</th>
        <th>Quantity</th>
        <th>Price(₹)</th>
        <th>Amount(₹)</th>
     </tr>
     </thead>

     <tbody>
     <tr>
        <td>Notebook</td>
        <td>2</td>
        <td>50</td>
        <td>100</td>
    
     </tr>
     
     <tr>
         <td>Pen</td>
         <td>5</td>
         <td>10</td>
         <td>50</td>

     </tr>


     <tr>
        <td>Book</td>
        <td>1</td>
        <td>200</td>
        <td>200</td>
     </tr>


     <tr>
        <td>Bag</td>
        <td>1</td>
        <td>500</td>
        <td>500</td>
     </tr>
     </tbody>
     <tfoot>
     <tr>
        <th colspan="3"> Total</th>
        <th>850</th>
     </tr>
     </tfoot>
    
    </Table>
    
</body>
</html>
